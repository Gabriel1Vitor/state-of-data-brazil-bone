      "2022": "('P2_b ', 'Setor')"
      "2023": "('P2_b ', 'Setor')"
      "2024-2025": "2.b_setor"
      "2025-2026": "2.b_setor"
    notes: "2019 só tem setor anonimizado (D4). 'Consultoria' vira 'Área de Consultoria' a partir de 2022."
  tamanho_empresa:
    status: proposed
    columns:
      "2019": "('P12', 'workers_number')"
      "2021": "('P2_c ', 'Numero de Funcionarios')"
      "2022": "('P2_c ', 'Numero de Funcionarios')"
      "2023": "('P2_c ', 'Numero de Funcionarios')"
      "2024-2025": "2.c_numero_de_funcionarios"
      "2025-2026": "2.c_numero_de_funcionarios"
    notes: "2021 escreve 'Acima de 3000'; a partir de 2022 'Acima de 3.000'. Há um rótulo com erro 'de 501 a 100' (= 501 a 1.000)."
  cargo_atual:
    status: proposed
    columns:
      "2019": "('D6', 'anonymized_role')"
      "2021": "('P2_f ', 'Cargo Atual')"
      "2022": "('P2_f ', 'Cargo Atual')"
      "2023": "('P2_f ', 'Cargo Atual')"
      "2024-2025": "2.f_cargo_atual"
      "2025-2026": "2.f_cargo_atual"
    notes: >-
      Opções mudam por edição. 2021: "Analista de BI/BI Analyst/Analytics Engineer" numa
      opção só; Analytics Engineer separado a partir de 2022. 2022–2023 juntam Engenheiro
      e Arquiteto de Dados; 2024+ separam. Nas análises, Arquiteto é somado a Engenheiro.
  tempo_experiencia_dados:
    status: proposed
    columns:
