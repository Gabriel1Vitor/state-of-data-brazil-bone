# Mapeamento canônico de colunas entre as 6 edições do State of Data Brazil.
#
# Fonte única de verdade para todos os scripts (scripts/sod/) e para a skill.
# Cada campo canônico tem, por edição, o nome EXATO da coluna no CSV daquela edição
# (ou null se a edição não tiver essa pergunta).
#
# status:
#   confirmed = validado com o dono da pesquisa
#   proposed  = inferido na harmonização e usado nos relatórios publicados, mas ainda
#               não revisado pelo dono — revisar antes de tratar como definitivo
#
# Nas edições 2021 a 2023 os nomes de coluna são tuplas serializadas como texto, por
# exemplo "('P2_h ', 'Faixa salarial')" — o espaço depois do código faz parte do nome.

editions:
  "2019":      { label: "2019",    file: "data/raw/2019/data_hackers_survey_2019.csv",      rows: 1765, fielded: "2019-11",               kaggle: "datahackers/pesquisa-data-hackers-2019" }
  "2021":      { label: "2021",    file: "data/raw/2021/state_of_data_2021.csv",            rows: 2645, fielded: "2021-10-18 a 2021-12-06", kaggle: "datahackers/state-of-data-2021" }
  "2022":      { label: "2022",    file: "data/raw/2022/state_of_data_2022.csv",            rows: 4271, fielded: "2022-10-10 a 2022-11-28", kaggle: "datahackers/state-of-data-2022" }
  "2023":      { label: "2023",    file: "data/raw/2023/state_of_data_2023.csv",            rows: 5293, fielded: "2023-10-16 a 2023-12-06", kaggle: "datahackers/state-of-data-brazil-2023" }
  "2024-2025": { label: "2024/25", file: "data/raw/2024-2025/state_of_data_2024_2025.csv",  rows: 5217, fielded: "2024-10-14 a 2024-12-18", kaggle: "datahackers/state-of-data-brazil-20242025" }
  "2025-2026": { label: "2025/26", file: "data/raw/2025-2026/state_of_data_2025_2026.csv",  rows: 3495, fielded: "2025-10-20 a 2025-12-22", kaggle: "datahackers/state-of-data-brazil-2025-2026" }

fields:
  salario_faixa:
    status: confirmed
    columns:
      "2019": "('P16', 'salary_range')"
      "2021": "('P2_h ', 'Faixa salarial')"
      "2022": "('P2_h ', 'Faixa salarial')"
      "2023": "('P2_h ', 'Faixa salarial')"
      "2024-2025": "2.h_faixa_salarial"
      "2025-2026": "2.h_faixa_salarial"
    notes: >-
      Faixas mensais em R$, idênticas de 2021 a 2025/26 (de "Menos de R$ 1.000" até
      "Acima de R$ 40.001"). Em 2019 a faixa mais alta é "Acima de R$ 25.001", então
      25k-40k+ não existe como faixa separada. Rótulos com erro de digitação (1 linha
      cada): 2023 "de R$ 101/mês a R$ 2.000/mês" = 1.001-2.000; 2025/26
      "de R$ 25.001/mês a R$ 3000/mês" = 25.001-30.000. Nulo = sem emprego/sem resposta.
  senioridade:
    status: confirmed
    columns:
      "2019": null
      "2021": "('P2_g ', 'Nivel')"
      "2022": "('P2_g ', 'Nivel')"
      "2023": "('P2_g ', 'Nivel')"
      "2024-2025": "2.g_nivel"
      "2025-2026": "2.g_nivel"
    notes: >-
      Júnior/Pleno/Sênior. Gestores não respondem essa pergunta (fica nulo) — o valor
      canônico "Gestor" vem do campo gestor. 2025/26 acrescentou "Especialista/Staff+",
      mantido como categoria própria (confirmado em 2026-09-22). 2019 não tem essa
      pergunta: 2019 entra só como Gestor/não gestor, sem estimar Jr/Pl/Sr.
  gestor:
    status: confirmed
    columns:
      "2019": "('P13', 'manager')"
      "2021": "('P2_d ', 'Gestor?')"
      "2022": "('P2_d ', 'Gestor?')"
      "2023": "('P2_d ', 'Gestor?')"
      "2024-2025": "2.d_atua_como_gestor"
      "2025-2026": "2.d_atua_como_gestor"
    notes: "0/1 na maioria das edições; em 2022 vem como True/False."
  genero:
    status: proposed
    columns:
      "2019": "('P2', 'gender')"
      "2021": "('P1_b ', 'Genero')"
      "2022": "('P1_b ', 'Genero')"
      "2023": "('P1_b ', 'Genero')"
      "2024-2025": "1.b_genero"
      "2025-2026": "1.b_genero"
  raca:
    status: proposed
    columns:
      "2019": null
      "2021": null
      "2022": "('P1_c ', 'Cor/raca/etnia')"
      "2023": "('P1_c ', 'Cor/raca/etnia')"
      "2024-2025": "1.c_cor/raca/etnia"
      "2025-2026": "1.c_cor/raca/etnia"
  pcd:
    status: proposed
    columns:
      "2019": null
      "2021": null
      "2022": "('P1_d ', 'PCD')"
      "2023": "('P1_d ', 'PCD')"
      "2024-2025": "1.d_pcd"
      "2025-2026": "1.d_pcd"
  experiencia_prejudicada:
    status: proposed
    columns:
      "2019": null
      "2021": null
      "2022": "('P1_e ', 'experiencia_profissional_prejudicada')"
      "2023": "('P1_e ', 'experiencia_profissional_prejudicada')"
      "2024-2025": "1.e_experiencia_profissional_prejudicada"
      "2025-2026": "1.e_experiencia_profissional_prejudicada"
    notes: "Respondida quase só por mulheres e pessoas não brancas; texto multi-seleção separado por vírgula."
  estado:
    status: proposed
    columns:
      "2019": "('P5', 'living_state')"
      "2021": "('P1_e_a ', 'uf onde mora')"
      "2022": "('P1_i_1 ', 'uf onde mora')"
      "2023": "('P1_i_1 ', 'uf onde mora')"
      "2024-2025": "1.i.1_uf_onde_mora"
      "2025-2026": "1.i.1_uf_onde_mora"
    notes: >-
      Sigla da UF. A pesquisa não pergunta a cidade. Estados com poucas respostas são
      anonimizados (só a região aparece). Em 2019 os valores são nomes de estado.
  regiao:
    status: proposed
    columns:
      "2019": "('D1', 'living_macroregion')"
      "2021": "('P1_e_b ', 'Regiao onde mora')"
      "2022": "('P1_i_2 ', 'Regiao onde mora')"
      "2023": "('P1_i_2 ', 'Regiao onde mora')"
      "2024-2025": "1.i.2_regiao_onde_mora"
      "2025-2026": "1.i.2_regiao_onde_mora"
    notes: "2019 usa 'Região Sudeste' etc. e só tem Sudeste/Sul; 2021 tem a categoria 'Exterior'."
  formacao_nivel:
    status: proposed
    columns:
      "2019": "('P8', 'degreee_level')"
      "2021": "('P1_h ', 'Nivel de Ensino')"
      "2022": "('P1_l ', 'Nivel de Ensino')"
      "2023": "('P1_l ', 'Nivel de Ensino')"
      "2024-2025": "1.l_nivel_de_ensino"
      "2025-2026": "1.l_nivel_de_ensino"
  situacao_trabalho:
    status: proposed
    columns:
      "2019": "('P10', 'job_situation')"
      "2021": "('P2_a ', 'Qual sua situação atual de trabalho?')"
      "2022": "('P2_a ', 'Qual sua situação atual de trabalho?')"
      "2023": "('P2_a ', 'Qual sua situação atual de trabalho?')"
      "2024-2025": "2.a_situação_de_trabalho"
      "2025-2026": "2.a_situação_de_trabalho"
    notes: >-
      Inclui "Vivo no Brasil e trabalho remoto para empresa de fora do Brasil" e
      "Vivo fora do Brasil e trabalho para empresa de fora do Brasil" (a partir de 2021).
      2019 escreve "Empregado (CTL)".
  setor_empresa:
