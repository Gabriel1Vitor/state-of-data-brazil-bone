# Perguntas de múltipla escolha que viram uma coluna binária por opção. Cada entrada
# dá o prefixo das colunas binárias em cada edição; o rótulo da opção vem depois do
# prefixo (ou dentro da tupla, em 2021–2023).
multiselect:
  linguagens_trabalho:
    status: proposed
    prefix: { "2019": "('P21'", "2021": "('P4_d_", "2022": "('P4_d_", "2023": "('P4_d_", "2024-2025": "4.d.", "2025-2026": null }
    notes: "2025/26 ('4.c.') pergunta linguagens PREFERIDAS — não comparável; deixado como null."
  cloud_trabalho:
    status: proposed
    prefix: { "2019": "('P25'", "2021": "('P4_g_", "2022": null, "2023": "('P4_h_", "2024-2025": "4.h.", "2025-2026": "4.e." }
    fixes:
      "2023": { "Azure (Microsoft)": "Amazon Web Services (AWS)", "Amazon Web Services (AWS)": "Google Cloud (GCP)", "Google Cloud (GCP)": "Azure (Microsoft)" }
    text_column:
      "2022": "('P4_g ', 'Quais das opções de Cloud listadas abaixo você utiliza no trabalho?')"
    notes: >-
      2023: rótulos das três primeiras colunas trocados (aplicar 'fixes'; conferido
      contra a cloud preferida). 2022: as colunas binárias 'P4_h_1..3' são a cloud
      PREFERIDA em one-hot; o uso real está no texto de 'text_column'.
  bi_trabalho:
    status: proposed
    prefix: { "2019": "('P27'", "2021": "('P4_h_", "2022": null, "2023": "('P4_j_", "2024-2025": "4.j.", "2025-2026": "4.g." }
    notes: "2022: só ~200 respostas no dataset ('P4_i_*'); deixado como null."

methodology_notes:
  - "2019: faixa salarial termina em 'Acima de R$ 25.001'; não há pergunta de senioridade Jr/Pl/Sr. Só gênero, desemprego e poucas outras perguntas são comparáveis."
  - "2025/26: novo nível 'Especialista/Staff+' tira do grupo Sênior parte das pessoas mais experientes; para comparar Sênior com anos anteriores, some Sênior + Staff+."
  - "2021: não há perguntas de cor/raça nem de PCD (começam em 2022)."
  - "Salário: valores em faixas; use mediana/quartis interpolados dentro da faixa (scripts/sod/stats.py). Para valores reais, use o IPCA de novembro de cada edição (data/reference/ipca_mensal.json)."
  - "Quem mora fora do Brasil ou trabalha para empresa estrangeira tem outro mercado salarial; separe esses grupos ao analisar salário."
  - "A amostra não é aleatória e o perfil muda entre edições (por exemplo, menos juniores a cada ano). Compare dentro de grupos (nível, experiência) antes de tirar conclusões sobre o mercado."
