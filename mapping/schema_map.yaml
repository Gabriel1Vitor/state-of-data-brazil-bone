      "2021": "('P2_i ', 'Quanto tempo de experiência na área de dados você tem?')"
      "2022": "('P2_i ', 'Quanto tempo de experiência na área de dados você tem?')"
      "2023": "('P2_i ', 'Quanto tempo de experiência na área de dados você tem?')"
